<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - ECOPULSE</title>
    <link rel="stylesheet" href="../css/style.css"/>
  </head>
  <body>
    <!--! important file-->
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script> 
    
    <!--!using parent which holds all the data inside-->
    <div class="parent">
      
      <!--!ECOPULSE Logo at top-->
      <div class="top-menu">
        <h6>ECOPULSE</h6>
      </div>
      
      <!--!top nav-bar-->
      <div class="nav-bar">
        <!--hamburger menu for mobile-->
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
        
        <!--TODO:nav content-->
        <ul style="list-style-type: none;" id="nav-menu">
          <li><a href="./services.html">Services</a></li>
          <li><a href="./blog.html">Blog</a></li>
          <li><a href="./aboutus.html">About Us</a></li>
          <li><a href="./login.html">Login</a></li>
          <li><a href="./contactus.html">Contact Us</a></li>
        </ul>
      </div>
      
      <!--!Hero section with title and content-->
      <div class="hero-section">
        <h1>Get in Touch with ECOPULSE</h1>
        <p>Have questions or feedback? We'd love to hear from you. Contact us today and let's work together to create a sustainable future.</p>
        
        <div class="contact-form">
          <form>
            <div class="form-group">
              <input type="text" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <input type="email" placeholder="Your Email" required>
            </div>
            <div class="form-group">
              <textarea placeholder="Your Message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>

      <!--!used for to the middle content-->
      <div class="middle-menu">
      </div>

    <!--!parent close-->
    </div>

    <!--!HAMBURGER MENU SCRIPT-->
    <script src="../java/hamburger.js"></script>
  </body>
</html>
